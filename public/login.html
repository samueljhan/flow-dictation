<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="robots" content="noindex">
    <title>Log In — Flow Dictation</title>
    <meta name="theme-color" content="#1a1a1a">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            background: #242424;
            border: 1px solid #333333;
            padding: 40px 32px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-align: center;
        }
        .subtitle {
            color: #909090;
            margin-bottom: 28px;
            text-align: center;
            font-size: 14px;
        }

        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            color: #a0a0a0;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.15s;
        }
        .form-input:focus { outline: none; border-color: #606060; }
        .form-input::placeholder { color: #666666; }

        /* All buttons are dark-on-dark — no white surfaces */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid transparent;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .btn-primary {
            background: #333333;
            color: #e8e8e8;
            border-color: #4a4a4a;
            margin-top: 8px;
        }
        .btn-primary:hover { background: #3c3c3c; border-color: #606060; }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-google {
            background: #1f1f1f;
            color: #d8d8d8;
            border-color: #404040;
        }
        .btn-google:hover { background: #262626; border-color: #606060; }
        .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #707070;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333333;
        }

        .error {
            background: rgba(220, 53, 69, 0.12);
            border: 1px solid rgba(220, 53, 69, 0.35);
            color: #e08a8a;
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 8px;
            line-height: 1.45;
            margin-bottom: 18px;
        }

        .auth-footer {
            margin-top: 24px;
            color: #707070;
            font-size: 12px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Flow Dictation</h1>
        <p class="subtitle">Radiology reporting assistant</p>

        <div id="errorBox" class="error" style="display:none"></div>

        <form method="POST" action="/auth/password" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Email</label>
                <input type="text" id="username" name="username" class="form-input"
                       autocomplete="username" inputmode="email" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary" id="signInBtn">Sign In</button>
        </form>

        <div class="divider">or</div>

        <a href="/auth/login/google" class="btn btn-google">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC04"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </a>

        <p class="auth-footer" id="footerNote"></p>
    </div>

    <script>
        const MESSAGES = {
            bad_credentials: 'Incorrect email or password.',
            bad_password: 'Incorrect email or password.',
            not_allowed: 'That Google account isn’t authorized for this app.',
            oauth_failed: 'Google sign-in failed. Please try again.',
            no_identity: 'Google didn’t return an identity. Please try again.',
            password_unconfigured: 'Password sign-in isn’t configured on this server.',
            google_unconfigured: 'Google sign-in isn’t configured on this server.',
            session_expired: 'Your session expired. Please sign in again.'
        };

        const err = new URLSearchParams(location.search).get('error');
        if (err) {
            const box = document.getElementById('errorBox');
            box.textContent = MESSAGES[err] || 'Sign-in failed.';
            box.style.display = '';
        }

        document.getElementById('loginForm').addEventListener('submit', function () {
            const btn = document.getElementById('signInBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in…';
        });

        // Surface a clear message if the server has no sign-in method configured
        fetch('/api/health').then(r => r.json()).then(d => {
            if (d.auth && !d.auth.google && !d.auth.password) {
                document.getElementById('footerNote').textContent =
                    'No sign-in method is configured on the server.';
            }
        }).catch(() => {});
    </script>
</body>
</html>
