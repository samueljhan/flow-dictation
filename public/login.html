<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in · Flow Dictation</title>
    <meta name="theme-color" content="#1a1a1a">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a; color: #e0e0e0;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; -webkit-font-smoothing: antialiased;
        }
        .box {
            background: #242424; border: 1px solid #333333; border-radius: 14px;
            padding: 32px; width: 100%; max-width: 380px;
            display: flex; flex-direction: column; gap: 18px;
        }
        h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
        p.sub { font-size: 13px; color: #909090; line-height: 1.5; margin-top: -10px; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 12px 16px; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 600; font-family: inherit; text-decoration: none;
            border: none; transition: all 0.2s;
        }
        .btn-google { background: #ffffff; color: #1a1a1a; }
        .btn-google:hover { background: #f0f0f0; }
        .btn-primary { background: #e0e0e0; color: #1a1a1a; }
        .btn-primary:hover { background: #ffffff; }
        .divider {
            display: flex; align-items: center; gap: 12px;
            color: #707070; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #333333; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input[type="password"] {
            width: 100%; padding: 11px 13px; font-size: 14px; font-family: inherit;
            background: #1a1a1a; color: #e0e0e0; border: 1px solid #404040; border-radius: 8px;
        }
        input[type="password"]:focus { outline: none; border-color: #606060; }
        .error {
            background: rgba(220,53,69,0.12); border: 1px solid rgba(220,53,69,0.4);
            color: #e08a8a; font-size: 13px; padding: 10px 12px; border-radius: 8px; line-height: 1.45;
        }
        .note { font-size: 12px; color: #707070; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="box">
        <div>
            <h1>Flow Dictation</h1>
            <p class="sub" style="margin-top:6px">Sign in to continue.</p>
        </div>

        <div id="error" class="error" style="display:none"></div>

        <a class="btn btn-google" href="/auth/login/google">
            <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.7-.4-4H24v7.3h12.1c-.2 1.8-1.6 4.7-4.5 6.6l6.9 5.3c4.1-3.8 6.6-9.4 6.6-15.2z"/>
                <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.9-5.3c-1.9 1.3-4.4 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.700000000000001l-7.1 5.5C8.1 40.7 15.4 46 24 46z"/>
                <path fill="#FBBC05" d="M11.5 27.9c-.5-1.4-.7-2.9-.7-4.4s.3-3 .7-4.4l-7.1-5.5C2.9 16.5 2 20.1 2 23.5s.9 7 2.4 9.9l7.1-5.5z"/>
                <path fill="#EA4335" d="M24 10.6c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 4.4 29.9 2 24 2 15.4 2 8.1 7.3 4.4 13.6l7.1 5.5C13.3 14.4 18.2 10.6 24 10.6z"/>
            </svg>
            Continue with Google
        </a>

        <div id="passwordSection" style="display:none">
            <div class="divider">or</div>
            <form method="POST" action="/auth/password" style="margin-top:14px">
                <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
                <button class="btn btn-primary" type="submit">Sign in</button>
            </form>
        </div>

        <p class="note" id="note"></p>
    </div>

    <script>
        const MESSAGES = {
            not_allowed: 'That Google account isn’t authorized for this app.',
            oauth_failed: 'Google sign-in failed. Please try again.',
            no_identity: 'Google didn’t return an identity. Please try again.',
            bad_password: 'Incorrect password.',
            password_unconfigured: 'Password sign-in isn’t configured. Use Google.',
            google_unconfigured: 'Google sign-in isn’t configured on this server.',
            session_expired: 'Your session expired. Please sign in again.'
        };
        const err = new URLSearchParams(location.search).get('error');
        if (err) {
            const el = document.getElementById('error');
            el.textContent = MESSAGES[err] || 'Sign-in failed.';
            el.style.display = '';
        }
        // Only offer the password form if the server has one configured
        fetch('/api/health').then(r => r.json()).then(d => {
            if (d.auth && d.auth.password) document.getElementById('passwordSection').style.display = '';
            if (d.auth && !d.auth.google && !d.auth.password) {
                document.getElementById('note').textContent =
                    'No sign-in method is configured on the server. Set GOOGLE_CLIENT_ID/SECRET or APP_PASSWORD.';
            }
        }).catch(() => {});
    </script>
</body>
</html>
